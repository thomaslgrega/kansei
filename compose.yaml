services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: kansei
      POSTGRES_PASSWORD: kansei
      POSTGRES_DB: kansei
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kansei -d kansei"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata: